# Netlify — نشر لوحة تحكم Yalla (React + Vite)
# https://docs.netlify.com/configure-builds/file-based-configuration/
#
# عند ربط المستودع في Netlify اضبط في الواجهة:
#   Base directory:  admin      ← بهذا تقرأ Netlify هذا الملف من داخل admin/
# (أمر البناء ومجلّد النشر مضبوطان أدناه، ونسبيّان لمجلّد admin/)
#
# مهم: اضبط متغيّر البيئة VITE_API_URL من لوحة Netlify (Site settings → Environment)
#       على عنوان الـ Backend على Oracle، مثال:
#       VITE_API_URL = https://yalla-api.duckdns.org
#       (يُقرأ وقت البناء — أي تغيير يتطلّب إعادة نشر Redeploy)

[build]
  command = "npm run build"
  publish = "dist"

# تطبيق صفحة واحدة (SPA): أعِد توجيه أي مسار غير موجود إلى index.html
[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200
