name: yalla
description: "Yalla — تطبيق التوصيل اللحظي (المستخدم/الكابتن)."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # الخطوط: IBM Plex Sans Arabic (خطّ نظام Yalla Velocity)
  google_fonts: ^6.2.1

  # الشبكة والتخزين
  http: ^1.2.0
  flutter_secure_storage: ^9.2.2

  # اللحظي والموقع
  socket_io_client: ^2.0.3+1
  geolocator: ^11.0.0
  # ملاحظة: google_maps_flutter أُزيلت من الإعداد الافتراضي لتسهيل التشغيل
  # (تحتاج مفتاح Google Maps). شاشتا الطلب والتتبّع تعملان بلا خريطة حاليًا.

  # ملاحظة: إشعارات FCM أُزيلت من الإعداد الافتراضي لتسهيل أوّل تشغيل.
  # لإعادتها: أضف firebase_core و firebase_messaging وأعد ملفّ push_service.dart،
  # ثم شغّل `flutterfire configure`.

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.2

  # توليد أيقونة التطبيق واسمه على أجهزة Android/iOS (Card: تغيير الأيقونة والاسم)
  flutter_launcher_icons: ^0.13.1
  flutter_launcher_name: ^0.0.1

flutter:
  uses-material-design: true
  assets:
    - assets/icon/

# اسم التطبيق كما يظهر تحت الأيقونة على الجهاز (يستبدل الاسم الافتراضي "mobile")
# التطبيق:  dart run flutter_launcher_name
flutter_launcher_name:
  name: "Yalla"

# أيقونة التطبيق المثبّت (تستبدل أيقونة Flutter الافتراضية)
# التطبيق:  dart run flutter_launcher_icons
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/yalla_icon.png"
  min_sdk_android: 21
  # أيقونة تكيّفية (Android 8+): خلفية برتقالية بعلامة الاسكوتر البيضاء
  adaptive_icon_background: "#FF6B00"
  adaptive_icon_foreground: "assets/icon/yalla_icon_foreground.png"
  remove_alpha_ios: true
