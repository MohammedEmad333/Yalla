name: yalla
description: "Yalla — تطبيق التوصيل اللحظي (المستخدم/الكابتن)."
publish_to: 'none'
version: 1.0.1+2

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # الخطوط: IBM Plex Sans Arabic (خطّ نظام Yalla Velocity)
  google_fonts: ^6.2.1

  # الشبكة والتخزين
  http: ^1.2.0
  http_parser: ^4.0.2 # لتحديد نوع محتوى الصورة عند الرفع (multipart)
  flutter_secure_storage: ^9.2.2

  # اختيار صورة الإيصال من المعرض/الكاميرا (شحن الرصيد — المرحلة 1)
  image_picker: ^1.1.2

  # اللحظي والموقع
  socket_io_client: ^2.0.3+1
  geolocator: ^11.0.0

  # خدمة خرائط جوجل (Card 10): نفتح تطبيق/موقع خرائط جوجل للملاحة وعرض المواقع
  # عبر روابط عميقة (بلا مفتاح API ولا SDK أصلي) — يعمل على الأجهزة الحقيقية مباشرة.
  # لإضافة خريطة مضمّنة داخل التطبيق لاحقًا: أضف google_maps_flutter + مفتاح Google Maps.
  url_launcher: ^6.2.5

  # إشعارات FCM (Card 22) — تصل حتى والتطبيق مغلق.
  # التهيئة عبر lib/firebase_options.dart (تُولَّد بـ `flutterfire configure`)،
  # والكود آمن: إن لم يُولَّد الملف بعد تبقى الإشعارات معطّلة دون كسر التطبيق.
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.2

  # توليد أيقونة التطبيق على أجهزة Android/iOS (Card: تغيير الأيقونة والاسم)
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true
  assets:
    - assets/icon/

# اسم التطبيق كما يظهر تحت الأيقونة "Yalla" يُضبط يدويًا في AndroidManifest
# (android:label) وiOS Info.plist — راجع README (خطوة 5).

# أيقونة التطبيق المثبّت (تستبدل أيقونة Flutter الافتراضية)
# التطبيق:  dart run flutter_launcher_icons
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/yalla_icon.png"
  min_sdk_android: 21
  # أيقونة تكيّفية (Android 8+): نفس أيقونة Google Play (علامة الاسكوتر) على خلفية بيضاء
  # لتطابق الأيقونة الخارجية للتطبيق مع أيقونة المتجر (Card 49).
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/icon/yalla_icon_foreground.png"
  remove_alpha_ios: true
