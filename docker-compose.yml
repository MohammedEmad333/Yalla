# تشغيل منظومة يلا كاملة محليًا: قاعدة البيانات + Redis + الـ API + لوحة الأدمن.
# الاستخدام:  docker compose up --build

services:
  mongo:
    image: mongodb/mongodb-community-server:7.0-ubuntu2204
    container_name: yalla-mongo
    restart: unless-stopped
    ports:
      - '127.0.0.1:27017:27017'
    volumes:
      - mongo_data:/data/db

  # مخزن مشترك وخفيف لعدادات rate limiting. لا نكشف منفذه للمضيف.
  redis:
    image: redis:7.4-alpine
    container_name: yalla-redis
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'no', '--save', '']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./backend
    container_name: yalla-api
    restart: unless-stopped
    ports:
      - '4000:4000'
    environment:
      PORT: 4000
      NODE_ENV: development
      MONGO_URI: mongodb://mongo:27017/yalla
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in a local .env file}
      JWT_EXPIRES_IN: 7d
      CORS_ORIGIN: ${CORS_ORIGIN:-*}
      AUTO_ASSIGN: ${AUTO_ASSIGN:-false}
      FCM_CREDENTIALS_JSON: ${FCM_CREDENTIALS_JSON:-}
      JAWWAL_PAY_BASE_URL: ${JAWWAL_PAY_BASE_URL:-https://api.leadersms.ps}
      JAWWAL_PAY_AUTH_MODE: ${JAWWAL_PAY_AUTH_MODE:-BASIC}
      JAWWAL_PAY_USERNAME: ${JAWWAL_PAY_USERNAME:-}
      JAWWAL_PAY_PASSWORD: ${JAWWAL_PAY_PASSWORD:-}
      JAWWAL_PAY_PRIVATE_KEY: ${JAWWAL_PAY_PRIVATE_KEY:-}
      MEDIA_ROOT: /app/media
    volumes:
      - uploads_data:/app/uploads
      - media_data:/app/media
    depends_on:
      mongo:
        condition: service_started
      redis:
        condition: service_healthy

  admin:
    build:
      context: ./admin
      args:
        VITE_API_URL: http://localhost:4000
    container_name: yalla-admin
    restart: unless-stopped
    ports:
      - '8090:80'
    depends_on:
      - api

volumes:
  mongo_data:
  uploads_data:
  media_data:
