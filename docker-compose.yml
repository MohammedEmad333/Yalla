# تشغيل منظومة يلا كاملة محليًا: قاعدة البيانات + الـ API + لوحة الأدمن.
# الاستخدام:  docker compose up --build

services:
  # قاعدة بيانات MongoDB مع تخزين دائم.
  # نستخدم صورة MongoDB الرسميّة متعدّدة المعماريّات (amd64 + arm64)
  # لأن صورة "mongo:7" الرسميّة لا توفّر نسخة arm64.
  mongo:
    image: mongodb/mongodb-community-server:7.0-ubuntu2204
    container_name: yalla-mongo
    restart: unless-stopped
    ports:
      - '27017:27017'
    volumes:
      - mongo_data:/data/db
    # ملاحظة: صورة community-server لا تتضمّن mongosh، لذا لا نضع healthcheck
    # يعتمد عليه؛ بدلًا من ذلك يعيد الـ API محاولة الاتصال حتى جاهزية القاعدة.

  # خادم الـ API (Express + Socket.io)
  api:
    build: ./backend
    container_name: yalla-api
    restart: unless-stopped
    ports:
      - '4000:4000'
    environment:
      PORT: 4000
      NODE_ENV: production
      # اسم الخدمة "mongo" يُحلّ داخل شبكة compose
      MONGO_URI: mongodb://mongo:27017/yalla
      JWT_SECRET: ${JWT_SECRET:-change_me_super_secret}
      JWT_EXPIRES_IN: 7d
      CORS_ORIGIN: '*'
      AUTO_ASSIGN: ${AUTO_ASSIGN:-false}
    # تخزين دائم للملفّات المرفوعة (إيصالات الشحن + مستندات توثيق الكباتن)
    # حتى لا تُمحى عند إعادة بناء/إنشاء الحاوية. الصور الشخصية تُخزَّن في
    # قاعدة البيانات (FileAsset) فلا تتأثّر أصلًا.
    volumes:
      - uploads_data:/app/uploads
    # نبدأ mongo أولًا؛ والـ API يعيد محاولة الاتصال حتى جاهزيتها
    depends_on:
      - mongo

  # لوحة الأدمن (React مبنيّة + nginx)
  admin:
    build:
      context: ./admin
      args:
        # عنوان الـ API كما يراه المتصفّح (المضيف)
        VITE_API_URL: http://localhost:4000
    container_name: yalla-admin
    restart: unless-stopped
    ports:
      # 8090 على المضيف (8080 قد يكون مشغولًا بتطبيق آخر) → 80 داخل الحاوية
      - '8090:80'
    depends_on:
      - api

volumes:
  mongo_data:
  uploads_data:
