# إعداد Cloudflare Pages لتطبيق يلا الويب (PWA) — البطاقة 53
# https://developers.cloudflare.com/pages/functions/wrangler-configuration/
#
# الموقع ثابت بحت (HTML + PNG + manifest + service worker) داخل مجلد site/.
# لا يوجد خطوة build — نرفع محتوى المجلد كما هو.
#
# النشر عبر CLI:
#   npm i -g wrangler        # أو: npx wrangler ...
#   wrangler login
#   wrangler pages deploy    # يقرأ pages_build_output_dir أدناه تلقائيًا
#
# أول مرّة سيسألك wrangler عن اسم المشروع — استخدم "yalla-app".

name = "yalla-app"
pages_build_output_dir = "site"
compatibility_date = "2026-08-20"
