# إعداد Cloudflare لتطبيق يلا الويب — البطاقة 53
# يُنشر كـ Worker يخدم ملفات ثابتة (Static Assets).
# https://developers.cloudflare.com/workers/static-assets/
#
# محتوى web-app/ هو ناتج بناء Flutter للويب (flutter build web).
# لإعادة البناء بعد أي تعديل على تطبيق mobile/، شغّل: tool/build-web.sh
#
# النشر:
#   - تلقائيًا عبر ربط GitHub (Deploy command: npx wrangler deploy)
#   - أو يدويًا:  npx wrangler deploy

name = "yalla"
compatibility_date = "2026-08-20"

[assets]
directory = "./web-app"
# تطبيق صفحة واحدة (SPA): أي مسار غير موجود يرجع index.html ليقوده توجيه Flutter
not_found_handling = "single-page-application"
