name: Apply rewards order patch

on:
  push:
    paths:
      - .github/workflows/apply-rewards-order-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fix reward reservation rollback and remove one-shot workflow
        run: |
          python3 <<'PY'
          from pathlib import Path
          p = Path('backend/src/services/order.service.js')
          s = p.read_text()
          old = """  const scheduleError = validateScheduledAt(payload.scheduledAt);\n  if (scheduleError) throw Object.assign(new Error(scheduleError), { statusCode: 400 });\n  const scheduledAt = payload.scheduledAt ? new Date(payload.scheduledAt) : null;\n"""
          new = """  const scheduleError = validateScheduledAt(payload.scheduledAt);\n  if (scheduleError) {\n    await rewardsService.releaseReservation(userId, reward.pointsUsed);\n    throw Object.assign(new Error(scheduleError), { statusCode: 400 });\n  }\n  const scheduledAt = payload.scheduledAt ? new Date(payload.scheduledAt) : null;\n"""
          if old in s:
              p.write_text(s.replace(old, new, 1))
          elif new not in s:
              raise SystemExit('Expected schedule validation block not found')
          PY
          node --check backend/src/services/order.service.js
          git rm .github/workflows/apply-rewards-order-patch.yml
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/src/services/order.service.js
          git commit -m "fix(rewards): return reserved points on invalid schedule"
          git pull --rebase origin main
          git push origin HEAD:main
