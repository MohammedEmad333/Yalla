name: CI

# نفّذ الفحوص على main وعلى كل Pull Request. الفروع تحصل على الفحص عبر PR
# بدل تشغيل CI كامل عند كل push إلى أي فرع، لتقليل التكرار واستهلاك Actions.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── فحص الـ Backend: اختبارات الوحدة + التكامل ضدّ MongoDB حقيقي ──
  backend:
    runs-on: ubuntu-latest

    # حاوية MongoDB جانبية — تتيح تشغيل اختبارات التكامل دون تنزيل ثنائي مؤقت
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        # ننتظر جاهزية القاعدة قبل بدء الخطوات
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ ping: 1 }).ok'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: تثبيت التبعيات
        run: npm ci

      - name: اختبارات الوحدة
        run: npm test

      - name: اختبارات التكامل (ضدّ MongoDB)
        # تمرير عنوان القاعدة يجعل العدّة تستخدم مونجو الحقيقي بدل التنزيل
        env:
          TEST_MONGO_URI: mongodb://localhost:27017/yalla_ci
        run: npm run test:integration

  # ── فحص بناء لوحة الأدمن (يلتقط أخطاء البناء مبكرًا) ──
  admin-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: admin/package-lock.json
      - name: تثبيت وبناء
        run: |
          npm ci
          npm run build


  mobile-check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: تثبيت التبعيات
        run: flutter pub get
      - name: تحليل Flutter
        run: flutter analyze --no-fatal-infos
      - name: اختبارات Flutter
        run: flutter test

  partner-check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: partner
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: تثبيت التبعيات
        run: flutter pub get
      - name: تحليل Flutter
        run: flutter analyze --no-fatal-infos

  bot-check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bot
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: bot/package-lock.json
      - name: تثبيت التبعيات
        run: npm ci
      - name: فحص Syntax
        run: npm run check
      - name: اختبارات البوت
        run: npm test
      - name: فحص أمني
        run: npm audit --omit=dev --audit-level=high
