name: CI

# نفّذ الفحوص على main وعلى كل Pull Request. الفروع تحصل على الفحص عبر PR
# بدل تشغيل CI كامل عند كل push إلى أي فرع، لتقليل التكرار واستهلاك Actions.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── فحص الـ Backend: اختبارات الوحدة + التكامل ضدّ MongoDB وRedis حقيقيين ──
  backend:
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ ping: 1 }).ok'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    defaults:
      run:
        working-directory: backend

    env:
      REDIS_URL: redis://127.0.0.1:6379/0
      TEST_REDIS_URL: redis://127.0.0.1:6379/0

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: تثبيت التبعيات
        run: npm ci

      - name: فحص أمني للتبعيات الإنتاجية
        run: npm audit --omit=dev --audit-level=high

      - name: اختبارات الوحدة
        run: npm test

      - name: اختبارات التكامل (ضدّ MongoDB)
        env:
          TEST_MONGO_URI: mongodb://localhost:27017/yalla_ci
        run: npm run test:integration

  admin-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: admin/package-lock.json
      - name: تثبيت التبعيات
        run: npm ci
      - name: فحص أمني للتبعيات الإنتاجية
        run: npm audit --omit=dev --audit-level=high
      - name: بناء لوحة الأدمن
        run: npm run build

  mobile-check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          cache: true
      - name: تثبيت التبعيات
        run: flutter pub get
      - name: تحليل Flutter
        run: flutter analyze --no-fatal-infos
      - name: تجهيز الخط العربي للاختبارات
        run: |
          mkdir -p assets/fonts
          curl --fail --location --retry 3 --connect-timeout 15 --max-time 90 \
            --output assets/fonts/IBMPlexSansArabic-Regular.ttf \
            https://raw.githubusercontent.com/google/fonts/main/ofl/ibmplexsansarabic/IBMPlexSansArabic-Regular.ttf
          test "$(wc -c < assets/fonts/IBMPlexSansArabic-Regular.ttf)" -gt 10000
      - name: اختبارات Flutter
        run: flutter test

  partner-check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: partner
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          cache: true
      - name: تثبيت التبعيات
        run: flutter pub get
      - name: تحليل Flutter
        run: flutter analyze --no-fatal-infos
      - name: اختبارات Flutter للشركاء
        run: flutter test

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: اختبار بناء صورة Backend للإنتاج
        run: docker build --build-arg GIT_SHA="${{ github.sha }}" -t yalla-api:ci ./backend

  bot-check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bot
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: bot/package-lock.json
      - name: تثبيت التبعيات
        run: npm ci
      - name: فحص Syntax
        run: npm run check
      - name: اختبارات البوت
        run: npm test
      - name: فحص أمني
        run: npm audit --omit=dev --audit-level=high
