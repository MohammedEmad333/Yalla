name: CI

# نفّذ الفحوص على main وعلى كل Pull Request. الفروع تحصل على الفحص عبر PR
# بدل تشغيل CI كامل عند كل push إلى أي فرع، لتقليل التكرار واستهلاك Actions.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      admin: ${{ steps.filter.outputs.admin }}
      mobile: ${{ steps.filter.outputs.mobile }}
      partner: ${{ steps.filter.outputs.partner }}
      docker: ${{ steps.filter.outputs.docker }}
      bot: ${{ steps.filter.outputs.bot }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - name: Detect changed components
        id: filter
        shell: bash
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            for component in backend admin mobile partner docker bot; do
              echo "$component=true" >> "$GITHUB_OUTPUT"
            done
            exit 0
          fi

          git fetch --no-tags origin main
          git diff --name-only origin/main...HEAD > /tmp/ci-changed-files
          if grep -qx '.github/workflows/ci.yml' /tmp/ci-changed-files; then
            for component in backend admin mobile partner docker bot; do
              echo "$component=true" >> "$GITHUB_OUTPUT"
            done
            exit 0
          fi

          for component in backend admin mobile partner bot; do
            if grep -q "^$component/" /tmp/ci-changed-files; then
              echo "$component=true" >> "$GITHUB_OUTPUT"
            else
              echo "$component=false" >> "$GITHUB_OUTPUT"
            fi
          done
          if grep -q '^backend/' /tmp/ci-changed-files; then
            echo "docker=true" >> "$GITHUB_OUTPUT"
          else
            echo "docker=false" >> "$GITHUB_OUTPUT"
          fi
  # ── فحص الـ Backend: اختبارات الوحدة + التكامل ضدّ MongoDB وRedis حقيقيين ──
  backend:
    needs: changes
    if: github.event_name == 'push' || needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ ping: 1 }).ok'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    defaults:
      run:
        working-directory: backend

    env:
      REDIS_URL: redis://127.0.0.1:6379/0
      TEST_REDIS_URL: redis://127.0.0.1:6379/0

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: تثبيت التبعيات
        run: npm ci

      - name: فحص أمني للتبعيات الإنتاجية
        run: npm audit --omit=dev --audit-level=high

      - name: اختبارات الوحدة
        run: npm test

      - name: اختبارات التكامل (ضدّ MongoDB)
        env:
          TEST_MONGO_URI: mongodb://localhost:27017/yalla_ci
        run: npm run test:integration

  admin-build:
    needs: changes
    if: github.event_name == 'push' || needs.changes.outputs.admin == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: admin/package-lock.json
      - name: تثبيت التبعيات
        run: npm ci
      - name: فحص أمني للتبعيات الإنتاجية
        run: npm audit --omit=dev --audit-level=high
      - name: بناء لوحة الأدمن
        run: npm run build

  mobile-check:
    needs: changes
    if: github.event_name == 'push' || needs.changes.outputs.mobile == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          cache: true
      - name: تثبيت التبعيات
        run: flutter pub get
      - name: تحليل Flutter
        run: flutter analyze --no-fatal-infos
      - name: اختبارات Flutter
        run: flutter test

  partner-check:
    needs: changes
    if: github.event_name == 'push' || needs.changes.outputs.partner == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: partner
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          cache: true
      - name: تثبيت التبعيات
        run: flutter pub get
      - name: تحليل Flutter
        run: flutter analyze --no-fatal-infos
      - name: اختبارات Flutter للشركاء
        run: flutter test

  docker-build:
    needs: changes
    if: github.event_name == 'push' || needs.changes.outputs.docker == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: اختبار بناء صورة Backend للإنتاج
        run: docker build --build-arg GIT_SHA="${{ github.sha }}" -t yalla-api:ci ./backend

  bot-check:
    needs: changes
    if: github.event_name == 'push' || needs.changes.outputs.bot == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bot
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: bot/package-lock.json
      - name: تثبيت التبعيات
        run: npm ci
      - name: فحص Syntax
        run: npm run check
      - name: اختبارات البوت
        run: npm test
      - name: فحص أمني
        run: npm audit --omit=dev --audit-level=high
