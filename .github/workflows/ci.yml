name: CI

# نفّذ الفحوص على main وعلى كل Pull Request. الفروع تحصل على الفحص عبر PR
# بدل تشغيل CI كامل عند كل push إلى أي فرع، لتقليل التكرار واستهلاك Actions.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  # Reduce PR runner minutes without weakening the complete main-branch suite.
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.select.outputs.backend }}
      admin: ${{ steps.select.outputs.admin }}
      mobile: ${{ steps.select.outputs.mobile }}
      partner: ${{ steps.select.outputs.partner }}
      docker: ${{ steps.select.outputs.docker }}
      bot: ${{ steps.select.outputs.bot }}
      telegram: ${{ steps.select.outputs.telegram }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - name: Detect affected components (fallback to full suite)
        id: select
        shell: bash
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          backend=false; admin=false; mobile=false; partner=false
          docker=false; bot=false; telegram=false; full=false
          if [[ "$GITHUB_EVENT_NAME" != pull_request || -z "$PR_BASE_SHA" ]]; then
            full=true
          elif ! git cat-file -e "$PR_BASE_SHA^{commit}" 2>/dev/null; then
            full=true
          else
            changed=$(git diff --name-only "$PR_BASE_SHA"...HEAD) || full=true
            [[ -n "$changed" ]] || full=true
            while IFS= read -r file; do
              case "$file" in
                backend/*) backend=true; docker=true; telegram=true ;;
                admin/*) admin=true ;;
                mobile/*) mobile=true ;;
                partner/*) partner=true ;;
                bot/*) bot=true ;;
                telegram-captain-bot/*) telegram=true ;;
                docs/*|site/*) : ;;
                *) full=true ;;
              esac
            done <<< "$changed"
          fi
          if [[ "$full" == true ]]; then
            backend=true; admin=true; mobile=true; partner=true
            docker=true; bot=true; telegram=true
          fi
          printf '%s\n' "backend=$backend" "admin=$admin" "mobile=$mobile" \
            "partner=$partner" "docker=$docker" "bot=$bot" "telegram=$telegram" >> "$GITHUB_OUTPUT"
  # ── فحص الـ Backend: اختبارات الوحدة + التكامل ضدّ MongoDB وRedis حقيقيين ──
  backend:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ ping: 1 }).ok'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    defaults:
      run:
        working-directory: backend

    env:
      REDIS_URL: redis://127.0.0.1:6379/0
      TEST_REDIS_URL: redis://127.0.0.1:6379/0

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: تثبيت التبعيات
        run: npm ci

      - name: فحص أمني للتبعيات الإنتاجية
        run: npm audit --omit=dev --audit-level=high

      - name: اختبارات الوحدة
        run: npm test

      - name: اختبارات التكامل (ضدّ MongoDB)
        env:
          TEST_MONGO_URI: mongodb://localhost:27017/yalla_ci
        run: npm run test:integration

  admin-build:
    needs: changes
    if: needs.changes.outputs.admin == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: admin/package-lock.json
      - name: تثبيت التبعيات
        run: npm ci
      - name: فحص أمني للتبعيات الإنتاجية
        run: npm audit --omit=dev --audit-level=high
      - name: بناء لوحة الأدمن
        run: npm run build

  mobile-check:
    needs: changes
    if: needs.changes.outputs.mobile == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          cache: true
      - name: تثبيت التبعيات
        run: flutter pub get
      - name: تحليل Flutter
        run: flutter analyze --no-fatal-infos
      - name: تجهيز الخط العربي للاختبارات
        run: bash tool/prepare_font.sh
      - name: اختبارات Flutter
        run: flutter test

  partner-check:
    needs: changes
    if: needs.changes.outputs.partner == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: partner
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          cache: true
      - name: تثبيت التبعيات
        run: flutter pub get
      - name: تحليل Flutter
        run: flutter analyze --no-fatal-infos
      - name: اختبارات Flutter للشركاء
        run: flutter test

  docker-build:
    needs: changes
    if: needs.changes.outputs.docker == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: اختبار بناء صورة Backend للإنتاج
        run: docker build --build-arg GIT_SHA="${{ github.sha }}" -t yalla-api:ci ./backend

  bot-check:
    needs: changes
    if: needs.changes.outputs.bot == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bot
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: bot/package-lock.json
      - name: تثبيت التبعيات
        run: npm ci
      - name: فحص Syntax
        run: npm run check
      - name: اختبارات البوت
        run: npm test
      - name: فحص أمني
        run: npm audit --omit=dev --audit-level=high

  telegram-captain-check:
    needs: changes
    if: needs.changes.outputs.telegram == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: telegram-captain-bot
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22'
      - name: فحص ملفات بوت تلجرام
        run: |
          node --check index.js
          node --check src/telegram.js
          node --check src/security.js
          node --check src/webhook.js
          node --check src/updateProcessor.js
      - name: اختبارات بوت تلجرام
        run: npm test

  # Stable required status, including when unaffected jobs are intentionally skipped.
  ci-required:
    if: always()
    needs: [changes, backend, admin-build, mobile-check, partner-check, docker-build, bot-check, telegram-captain-check]
    runs-on: ubuntu-latest
    steps:
      - name: Enforce successful affected jobs
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json, os, sys
          jobs = json.loads(os.environ['NEEDS_JSON'])
          outputs = jobs.get('changes', {}).get('outputs', {})
          checks = {
            'backend': 'backend', 'admin-build': 'admin',
            'mobile-check': 'mobile', 'partner-check': 'partner',
            'docker-build': 'docker', 'bot-check': 'bot',
            'telegram-captain-check': 'telegram',
          }
          errors = []
          if jobs.get('changes', {}).get('result') != 'success':
              errors.append('change detection failed')
          for name, flag in checks.items():
              result = jobs.get(name, {}).get('result')
              if outputs.get(flag) == 'true' and result != 'success':
                  errors.append(f'{name} required, but {result}')
              elif outputs.get(flag) != 'true' and result not in ('success', 'skipped'):
                  errors.append(f'{name} unexpectedly {result}')
          if errors:
              sys.exit('; '.join(errors))
          print('All required component checks passed.')
          PY
