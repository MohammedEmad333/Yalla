name: CI

# تشغيل الفحوص على كل push و pull request
on:
  push:
    branches: ['**']
  pull_request:

jobs:
  # ── فحص الـ Backend: اختبارات الوحدة + التكامل ضدّ MongoDB حقيقي ──
  backend:
    runs-on: ubuntu-latest

    # حاوية MongoDB جانبية — تتيح تشغيل اختبارات التكامل دون تنزيل ثنائي مؤقت
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        # ننتظر جاهزية القاعدة قبل بدء الخطوات
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ ping: 1 }).ok'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: تثبيت التبعيات
        run: npm ci

      - name: اختبارات الوحدة
        run: npm test

      - name: اختبارات التكامل (ضدّ MongoDB)
        # تمرير عنوان القاعدة يجعل العدّة تستخدم مونجو الحقيقي بدل التنزيل
        env:
          TEST_MONGO_URI: mongodb://localhost:27017/yalla_ci
        run: npm run test:integration

  # ── فحص بناء لوحة الأدمن (يلتقط أخطاء البناء مبكرًا) ──
  admin-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: تثبيت وبناء
        run: |
          npm install
          npm run build
