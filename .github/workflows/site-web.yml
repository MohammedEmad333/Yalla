name: Deploy Yalla Public Site

on:
  workflow_dispatch:
  push:
    branches: ['main']
    paths:
      - 'site/**'
      - 'wrangler-site.toml'
      - '.github/workflows/site-web.yml'

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Validate public site
        run: |
          test -f site/index.html
          test -f site/privacy.html
          test -f site/delete-account.html
          test -f site/yalla.css
          grep -q "app.yalladelivery.org" site/index.html
          grep -q "partner.yalladelivery.org" site/index.html

      - name: Deploy to Cloudflare Workers
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != '' }}
        run: npx --yes wrangler deploy --config wrangler-site.toml
