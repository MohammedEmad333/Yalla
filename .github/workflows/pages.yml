name: Redirect Legacy GitHub Pages URLs

# Keep old Google Play / bookmarked GitHub Pages URLs working while
# yalladelivery.org is the canonical home for legal pages.
on:
  push:
    branches: ['main']
    paths:
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v5

      - name: Build redirect pages
        run: |
          mkdir -p legacy-pages
          cat > legacy-pages/index.html <<'EOF'
          <!doctype html>
          <html><head>
            <meta charset="utf-8">
            <meta http-equiv="refresh" content="0; url=https://yalladelivery.org/">
            <link rel="canonical" href="https://yalladelivery.org/">
            <script>location.replace('https://yalladelivery.org/');</script>
          </head><body><a href="https://yalladelivery.org/">Yalla Delivery</a></body></html>
          EOF

          cat > legacy-pages/privacy.html <<'EOF'
          <!doctype html>
          <html><head>
            <meta charset="utf-8">
            <meta http-equiv="refresh" content="0; url=https://yalladelivery.org/privacy.html">
            <link rel="canonical" href="https://yalladelivery.org/privacy.html">
            <script>location.replace('https://yalladelivery.org/privacy.html');</script>
          </head><body><a href="https://yalladelivery.org/privacy.html">سياسة الخصوصية</a></body></html>
          EOF

          cat > legacy-pages/delete-account.html <<'EOF'
          <!doctype html>
          <html><head>
            <meta charset="utf-8">
            <meta http-equiv="refresh" content="0; url=https://yalladelivery.org/delete-account.html">
            <link rel="canonical" href="https://yalladelivery.org/delete-account.html">
            <script>location.replace('https://yalladelivery.org/delete-account.html');</script>
          </head><body><a href="https://yalladelivery.org/delete-account.html">حذف الحساب</a></body></html>
          EOF

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: legacy-pages

      - name: Deploy redirects
        id: deployment
        uses: actions/deploy-pages@v4
