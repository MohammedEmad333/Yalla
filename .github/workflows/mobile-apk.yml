name: Build Mobile Release

# بناء حزم Yalla للنشر من مشروع Android المتتبّع في Git:
#   • AAB موقّع للإصدار (app-release.aab) — الحزمة المطلوبة لرفعها على Google Play.
#   • APK موقّع (app-release.apk) — للتثبيت المباشر والاختبار على الأجهزة.
#
# التوقيع: يتطلّب أسرار المستودع التالية (Settings → Secrets and variables → Actions):
#   ANDROID_KEYSTORE_BASE64
#   ANDROID_KEYSTORE_PASSWORD
#   ANDROID_KEY_ALIAS
#   ANDROID_KEY_PASSWORD

on:
  workflow_dispatch:
    inputs:
      api_origin:
        description: 'عنوان الـ Backend الذي يتصل به التطبيق (API_ORIGIN)'
        required: false
        default: 'https://api.yalladelivery.org'
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile-apk.yml'

permissions:
  contents: write

concurrency:
  group: mobile-release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-release:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: تحديد API_ORIGIN
        run: |
          ORIGIN="${{ github.event.inputs.api_origin }}"
          if [ -z "$ORIGIN" ]; then ORIGIN="https://api.yalladelivery.org"; fi
          echo "API_ORIGIN=$ORIGIN" >> "$GITHUB_ENV"
          echo "سيُبنى التطبيق للاتصال بـ: $ORIGIN"

      - name: قراءة رقم الإصدار
        id: version
        run: |
          FULL_VERSION=$(awk '/^version:/ {print $2; exit}' pubspec.yaml)
          VERSION="${FULL_VERSION%%+*}"
          BUILD="${FULL_VERSION#*+}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "build=$BUILD" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "Yalla $VERSION+$BUILD"

      - name: تثبيت التبعيات
        run: flutter pub get

      - name: اختبارات Flutter
        run: flutter test

      - name: توليد أيقونة التطبيق
        run: dart run flutter_launcher_icons || echo "تخطّي توليد الأيقونة"

      - name: تجهيز توقيع الإصدار
        id: signing
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "::warning::لا توجد أسرار keystore — سيُبنى APK بمفتاح debug ولن يُنشر كإصدار."
            exit 0
          fi
          KEYSTORE_PATH="$PWD/android/app/upload-keystore.jks"
          echo "$KEYSTORE_B64" | base64 --decode > "$KEYSTORE_PATH"
          cat > android/key.properties <<EOF
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=$KEYSTORE_PATH
          EOF
          python3 tool/inject_signing.py
          echo "signed=true" >> "$GITHUB_OUTPUT"
          echo "تمّ تجهيز توقيع الإصدار."

      - name: بناء App Bundle (AAB) موقّع
        if: steps.signing.outputs.signed == 'true'
        run: flutter build appbundle --release --dart-define=API_ORIGIN=$API_ORIGIN

      - name: بناء APK
        run: flutter build apk --release --dart-define=API_ORIGIN=$API_ORIGIN

      - name: تجهيز ملفات الإصدار
        if: steps.signing.outputs.signed == 'true'
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk "../Yalla-${{ steps.version.outputs.version }}.apk"
          cp build/app/outputs/bundle/release/app-release.aab "../Yalla-${{ steps.version.outputs.version }}.aab"

      - name: إنشاء أو تحديث GitHub Release ورفع APK + AAB
        if: steps.signing.outputs.signed == 'true'
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
          BUILD: ${{ steps.version.outputs.build }}
        run: |
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" \
              --target "$GITHUB_SHA" \
              --title "Yalla $VERSION" \
              --notes "Yalla $VERSION (build $BUILD)\n\nيتضمن هذا الإصدار:\n- APK للتثبيت المباشر\n- AAB للرفع إلى Google Play"
          fi

          gh release upload "$TAG" \
            "Yalla-$VERSION.apk" \
            "Yalla-$VERSION.aab" \
            --clobber

          echo "تم نشر APK و AAB على GitHub Release: $TAG"

      # Artifacts تبقى نسخة إضافية مؤقتة فقط، ولا تمنع نجاح الإصدار إذا كانت الحصة ممتلئة.
      - name: رفع APK كـ Artifact اختياري
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: yalla-apk
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

      - name: رفع AAB كـ Artifact اختياري
        if: steps.signing.outputs.signed == 'true'
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: yalla-aab
          path: mobile/build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
