name: Build Mobile Release

# بناء حزم Yalla للنشر من مشروع Android المتتبّع في Git:
#   • AAB موقّع للإصدار (app-release.aab) — الحزمة المطلوبة لرفعها على Google Play.
#   • APK موقّع (app-release.apk) — للتثبيت المباشر والاختبار على الأجهزة.
#
# التوقيع: يتطلّب أسرار المستودع التالية (Settings → Secrets and variables → Actions):
#   ANDROID_KEYSTORE_BASE64  — ملفّ keystore (.jks) مُرمَّز base64
#   ANDROID_KEYSTORE_PASSWORD
#   ANDROID_KEY_ALIAS
#   ANDROID_KEY_PASSWORD
# راجع docs/08-google-play-release.md لخطوات توليد الـ keystore وإضافة الأسرار.
# بلا هذه الأسرار: يُبنى APK موقّع بمفتاح debug للاختبار فقط (غير صالح للنشر).
on:
  workflow_dispatch:
    inputs:
      api_origin:
        description: 'عنوان الـ Backend الذي يتصل به التطبيق (API_ORIGIN)'
        required: false
        default: 'https://api.yalladelivery.org'
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile-apk.yml'

concurrency:
  group: mobile-release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-release:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: تحديد API_ORIGIN
        run: |
          ORIGIN="${{ github.event.inputs.api_origin }}"
          if [ -z "$ORIGIN" ]; then ORIGIN="https://api.yalladelivery.org"; fi
          echo "API_ORIGIN=$ORIGIN" >> "$GITHUB_ENV"
          echo "سيُبنى التطبيق للاتصال بـ: $ORIGIN"

      - name: تثبيت التبعيات
        run: flutter pub get

      - name: اختبارات Flutter
        run: flutter test

      - name: توليد أيقونة التطبيق
        run: dart run flutter_launcher_icons || echo "تخطّي توليد الأيقونة"

      - name: تجهيز توقيع الإصدار
        id: signing
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "::warning::لا توجد أسرار keystore — سيُبنى APK موقّع بمفتاح debug للاختبار فقط (غير صالح للنشر على Google Play). أضِف الأسرار لبناء AAB موقّع."
            exit 0
          fi
          KEYSTORE_PATH="$PWD/android/app/upload-keystore.jks"
          echo "$KEYSTORE_B64" | base64 --decode > "$KEYSTORE_PATH"
          cat > android/key.properties <<EOF
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=$KEYSTORE_PATH
          EOF
          python3 tool/inject_signing.py
          echo "signed=true" >> "$GITHUB_OUTPUT"
          echo "تمّ تجهيز توقيع الإصدار."

      - name: بناء App Bundle (AAB) موقّع
        if: steps.signing.outputs.signed == 'true'
        run: flutter build appbundle --release --dart-define=API_ORIGIN=$API_ORIGIN

      - name: بناء APK
        run: flutter build apk --release --dart-define=API_ORIGIN=$API_ORIGIN

      # APK هو الحزمة المطلوبة للاختبار المباشر، لذلك نعطي رفعه الأولوية.
      # إذا كان تخزين Artifacts ممتلئاً، سيحاول الـ workflow رفعه قبل الـ AAB.
      - name: رفع الـ APK
        id: upload_apk
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: yalla-apk
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

      - name: رفع الـ AAB
        if: steps.signing.outputs.signed == 'true'
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: yalla-aab
          path: mobile/build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

      - name: التحقق من رفع APK
        if: always()
        run: |
          if [ "${{ steps.upload_apk.outcome }}" != "success" ]; then
            echo "::warning::تم بناء APK بنجاح لكن GitHub رفض رفع Artifact (غالباً بسبب حصة التخزين)."
            echo "APK موجود داخل runner في: build/app/outputs/flutter-apk/app-release.apk"
          else
            echo "تم رفع APK بنجاح كـ yalla-apk."
          fi
