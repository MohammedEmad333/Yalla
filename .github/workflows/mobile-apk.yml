name: Build Mobile Release

# بناء حزم Yalla للنشر:
#   • AAB موقّع للإصدار (app-release.aab) — الحزمة المطلوبة لرفعها على Google Play.
#   • APK موقّع (app-release.apk) — للتثبيت المباشر والاختبار على الأجهزة.
#
# التوقيع: يتطلّب أسرار المستودع التالية (Settings → Secrets and variables → Actions):
#   ANDROID_KEYSTORE_BASE64  — ملفّ keystore (.jks) مُرمَّز base64
#   ANDROID_KEYSTORE_PASSWORD
#   ANDROID_KEY_ALIAS
#   ANDROID_KEY_PASSWORD
# راجع docs/08-google-play-release.md لخطوات توليد الـ keystore وإضافة الأسرار.
# بلا هذه الأسرار: يُبنى APK موقّع بمفتاح debug للاختبار فقط (غير صالح للنشر).
on:
  workflow_dispatch:
    inputs:
      api_origin:
        description: 'عنوان الـ Backend الذي يتصل به التطبيق (API_ORIGIN)'
        required: false
        default: 'https://api.yalladelivery.org'
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile-apk.yml'

concurrency:
  group: mobile-release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-release:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile

    steps:
      - uses: actions/checkout@v4

      # Java مطلوب لبناء Android عبر Gradle
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # تثبيت Flutter (قناة stable) مع تخزين مؤقت لتسريع البناء.
      # stable الحديثة تستهدف compile/target SDK ≥ 35 (مطلوب لـ Google Play).
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # تحديد عنوان الخادم: مُدخَل التشغيل اليدوي أو الافتراضي السحابي
      - name: تحديد API_ORIGIN
        run: |
          ORIGIN="${{ github.event.inputs.api_origin }}"
          if [ -z "$ORIGIN" ]; then ORIGIN="https://api.yalladelivery.org"; fi
          echo "API_ORIGIN=$ORIGIN" >> "$GITHUB_ENV"
          echo "سيُبنى التطبيق للاتصال بـ: $ORIGIN"

      - name: تثبيت التبعيات
        run: flutter pub get

      # اختبارات الوحدة/الواجهة (نظام الألوان والوضع الليلي) قبل البناء
      - name: اختبارات Flutter
        run: flutter test

      # توليد أيقونة يلا في mipmap (غير حاسم — البناء يكمل بأيقونة افتراضية عند الفشل)
      - name: توليد أيقونة التطبيق
        run: dart run flutter_launcher_icons || echo "تخطّي توليد الأيقونة"

      # تجهيز توقيع الإصدار إن توفّرت الأسرار
      - name: تجهيز توقيع الإصدار
        id: signing
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "::warning::لا توجد أسرار keystore — سيُبنى APK موقّع بمفتاح debug للاختبار فقط (غير صالح للنشر على Google Play). أضِف الأسرار لبناء AAB موقّع."
            exit 0
          fi
          KEYSTORE_PATH="$PWD/android/app/upload-keystore.jks"
          echo "$KEYSTORE_B64" | base64 --decode > "$KEYSTORE_PATH"
          cat > android/key.properties <<EOF
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=$KEYSTORE_PATH
          EOF
          python3 tool/inject_signing.py
          echo "signed=true" >> "$GITHUB_OUTPUT"
          echo "تمّ تجهيز توقيع الإصدار."

      # بناء AAB موقّع للإصدار (حزمة Google Play) — فقط عند توفّر التوقيع
      - name: بناء App Bundle (AAB) موقّع
        if: steps.signing.outputs.signed == 'true'
        run: flutter build appbundle --release --dart-define=API_ORIGIN=$API_ORIGIN

      # بناء APK (موقّع بمفتاح الإصدار إن توفّر، وإلّا بمفتاح debug للاختبار)
      - name: بناء APK
        run: flutter build apk --release --dart-define=API_ORIGIN=$API_ORIGIN

      # رفع الـ AAB (للنشر على Google Play)
      - name: رفع الـ AAB
        if: steps.signing.outputs.signed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: yalla-aab
          path: mobile/build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error

      # رفع الـ APK (للتثبيت المباشر/الاختبار)
      - name: رفع الـ APK
        uses: actions/upload-artifact@v4
        with:
          name: yalla-apk
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
