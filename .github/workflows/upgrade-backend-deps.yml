name: Upgrade backend security dependencies

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/upgrade-backend-deps.yml'

permissions:
  contents: write

jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Migrate Firebase Admin initialization to modular API
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('backend/src/services/notification.service.js')
          text = path.read_text()
          old = """    // نحمّل الحزمة كسوليًا حتى لا تكون مطلوبة في بيئة بلا Firebase\n    // eslint-disable-next-line global-require\n    const admin = require('firebase-admin');\n    admin.initializeApp({ credential: admin.credential.cert(serviceAccount) });\n    messaging = admin.messaging();\n"""
          new = """    // نحمّل Firebase Admin كسوليًا حتى لا تكون مطلوبة في بيئة بلا Firebase.\n    // Firebase Admin v14 أزال الـ namespace القديم، لذلك نستخدم الـ modular API.\n    // eslint-disable-next-line global-require\n    const { initializeApp, cert, getApps } = require('firebase-admin/app');\n    // eslint-disable-next-line global-require\n    const { getMessaging } = require('firebase-admin/messaging');\n    const app = getApps()[0] || initializeApp({ credential: cert(serviceAccount) });\n    messaging = getMessaging(app);\n"""
          if old not in text:
              raise SystemExit('Expected legacy Firebase initialization block was not found')
          path.write_text(text.replace(old, new, 1))
          PY

      - name: Upgrade backend dependencies
        working-directory: backend
        run: |
          npm install firebase-admin@14.4.0 multer@2.0.2 --save
          npm audit fix || true
          npm pkg set 'overrides.uuid=11.1.1'
          npm pkg set 'engines.node=>=22'
          npm install

      - name: Verify backend syntax
        working-directory: backend
        run: |
          node --check src/server.js
          node --check src/services/notification.service.js

      - name: Run backend tests
        working-directory: backend
        run: npm test

      - name: Audit production dependencies
        working-directory: backend
        run: npm audit --omit=dev

      - name: Commit dependency upgrade and remove one-shot workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/package.json backend/package-lock.json backend/src/services/notification.service.js
          git rm .github/workflows/upgrade-backend-deps.yml
          git commit -m "fix(security): update backend dependencies and Firebase Admin API"
          git push origin HEAD:main
