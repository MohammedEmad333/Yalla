name: Build & Deploy Web App

# يبني نسخة الويب من تطبيق Yalla (Flutter web) من مصدر mobile/ ويعامل الناتج
# كـ build artifact فقط. لا يكتب Git commits تلقائية للملفات المولّدة، حتى لا
# يغيّر رأس Pull Requests أو يسبب ضوضاء/تعارضات في تاريخ Git.
#
# على Pull Requests: build + artifact للتحقق فقط.
# على main أو التشغيل اليدوي: build + artifact ثم نشر مباشر على Cloudflare عند
# توفّر CLOUDFLARE_API_TOKEN وCLOUDFLARE_ACCOUNT_ID.
on:
  workflow_dispatch:
    inputs:
      api_origin:
        description: 'عنوان الـ Backend الذي يتصل به تطبيق الويب (API_ORIGIN)'
        required: false
        default: 'https://api.yalladelivery.org'
  pull_request:
    paths:
      - 'mobile/**'
      - 'tool/build-web.sh'
      - 'tool/web-app-headers'
      - '.github/workflows/web-app.yml'
      - 'wrangler-app.toml'
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - 'tool/build-web.sh'
      - 'tool/web-app-headers'
      - '.github/workflows/web-app.yml'
      - 'wrangler-app.toml'

permissions:
  contents: read

# نسمح ببناء واحد لكل فرع في كل مرّة
concurrency:
  group: web-app-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    # نرفع أسرار Cloudflare لمستوى الوظيفة ليتمكّن شرط الخطوة من فحص توفّرها
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      # تثبيت Flutter (قناة stable) مع تخزين مؤقت لتسريع البناء
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # تحديد عنوان الخادم: مُدخَل التشغيل اليدوي أو الافتراضي السحابي
      - name: تحديد API_ORIGIN
        run: |
          ORIGIN="${{ github.event.inputs.api_origin }}"
          if [ -z "$ORIGIN" ]; then ORIGIN="https://api.yalladelivery.org"; fi
          echo "API_ORIGIN=$ORIGIN" >> "$GITHUB_ENV"
          echo "سيُبنى تطبيق الويب للاتصال بـ: $ORIGIN"

      # بناء Flutter web ونسخ الناتج إلى web-app/ (نستخدم السكربت الموجود)
      - name: بناء تطبيق الويب
        run: |
          chmod +x tool/build-web.sh
          tool/build-web.sh

      - name: رفع نسخة الويب كـ Artifact
        uses: actions/upload-artifact@v4
        with:
          name: yalla-web
          path: web-app
          if-no-files-found: error

      # النشر يتم فقط من main/تشغيل يدوي، ولا يحتاج أي commit مولّد.
      - name: نشر على Cloudflare
        if: ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != '' }}
        run: npx --yes wrangler deploy --config wrangler-app.toml
