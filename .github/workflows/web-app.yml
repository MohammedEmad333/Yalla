name: Build & Deploy Web App

# يبني نسخة الويب من تطبيق Yalla (Flutter web) من مصدر mobile/ ثم ينشرها مباشرة
# على Cloudflare من main أو التشغيل اليدوي. على Pull Requests نكتفي بالبناء للتحقق
# ولا نرفع artifact لتجنّب استهلاك مساحة GitHub Actions بلا حاجة.
on:
  workflow_dispatch:
    inputs:
      api_origin:
        description: 'عنوان الـ Backend الذي يتصل به تطبيق الويب (API_ORIGIN)'
        required: false
        default: 'https://api.yalladelivery.org'
  pull_request:
    paths:
      - 'mobile/**'
      - 'tool/build-web.sh'
      - 'tool/web-app-headers'
      - '.github/workflows/web-app.yml'
      - 'wrangler-app.toml'
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - 'tool/build-web.sh'
      - 'tool/web-app-headers'
      - '.github/workflows/web-app.yml'
      - 'wrangler-app.toml'

permissions:
  contents: read

concurrency:
  group: web-app-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          cache: true

      - name: تحديد API_ORIGIN
        run: |
          ORIGIN="${{ github.event.inputs.api_origin }}"
          if [ -z "$ORIGIN" ]; then ORIGIN="https://api.yalladelivery.org"; fi
          echo "API_ORIGIN=$ORIGIN" >> "$GITHUB_ENV"
          echo "سيُبنى تطبيق الويب للاتصال بـ: $ORIGIN"

      - name: بناء تطبيق الويب
        run: |
          chmod +x tool/build-web.sh
          tool/build-web.sh

      # لا نرفع web artifact؛ الناتج مؤقت ويُستخدم مباشرة للنشر أدناه.
      - name: نشر على Cloudflare
        if: ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != '' }}
        run: npx --yes wrangler deploy --config wrangler-app.toml
