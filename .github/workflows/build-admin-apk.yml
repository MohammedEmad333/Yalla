# بناء APK لنسخة أندرويد من لوحة الأدمن (Card 103) — تلقائيًا على خوادم GitHub.
#
# التشغيل: يدويًا من تبويب Actions (Run workflow)، أو عند دفع وسم admin-v*.
# النتيجة: ملف app-debug.apk يُرفع كـ Artifact لتنزيله وتثبيته على الهاتف.
#
# أسرار مطلوبة/اختيارية (Settings → Secrets and variables → Actions):
#   ADMIN_API_URL                (مطلوب) رابط الخادم المنشور، مثل https://<عنوان-خادمك-على-Oracle>
#   GOOGLE_SERVICES_JSON         (الأسهل، لتفعيل الإشعارات) الصق محتوى ملف google-services.json كما هو.
#   GOOGLE_SERVICES_JSON_BASE64  (بديل) نفس الملف مُرمَّزًا base64 — توليده على Linux/Mac: base64 -w0 google-services.json
#   ANDROID_KEYSTORE_BASE64 / KEYSTORE_PASSWORD / KEY_ALIAS / KEY_PASSWORD (اختياري) للإصدار الموقَّع.

name: Build Admin APK

on:
  workflow_dispatch:
    inputs:
      api_url:
        description: 'رابط الخادم (يتجاوز ADMIN_API_URL إن مُلئ)'
        required: false
        default: ''
  push:
    tags: ['admin-v*']

jobs:
  build-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin
    steps:
      - uses: actions/checkout@v4

      - name: إعداد Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: إعداد Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: إعداد Android SDK
        uses: android-actions/setup-android@v3

      - name: تثبيت التبعيات
        run: npm install

      - name: إضافة google-services.json (لتفعيل الإشعارات) إن توفّر
        env:
          GS_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
          GS_B64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          OUT=android/app/google-services.json
          if [ -n "$GS_JSON" ]; then
            # الأسهل: لصق محتوى الملف كما هو في السرّ GOOGLE_SERVICES_JSON
            printf '%s' "$GS_JSON" > "$OUT"
            echo "✅ google-services.json (JSON خام) مضاف — الإشعارات مفعّلة"
          elif [ -n "$GS_B64" ]; then
            # بديل: base64. نزيل الفراغات/الأسطر ونفكّ الترميز بتسامح ثم نتحقّق
            if printf '%s' "$GS_B64" | tr -d '[:space:]' | base64 -d > "$OUT" 2>/dev/null && grep -q '"project_id"' "$OUT"; then
              echo "✅ google-services.json (base64) مضاف — الإشعارات مفعّلة"
            else
              echo "::error::GOOGLE_SERVICES_JSON_BASE64 غير صالح. الأسهل: استخدم السرّ GOOGLE_SERVICES_JSON وألصق محتوى الملف كما هو. أو ولّد base64 صحيحًا على Linux/Mac بـ: base64 -w0 google-services.json"
              exit 1
            fi
          else
            echo "⚠️ بلا إعداد Firebase — سيُبنى التطبيق بلا إشعارات Push"
          fi

      - name: بناء الويب (Vite) بعنوان الـ API
        env:
          INPUT_URL: ${{ github.event.inputs.api_url }}
          SECRET_URL: ${{ secrets.ADMIN_API_URL }}
        run: |
          API_URL="${INPUT_URL:-$SECRET_URL}"
          if [ -z "$API_URL" ]; then
            echo "::warning::لم يُضبط ADMIN_API_URL — التطبيق لن يصل للخادم. اضبط السرّ ADMIN_API_URL."
          fi
          VITE_API_URL="$API_URL" npm run build

      - name: مزامنة Capacitor
        run: npx cap sync android

      - name: بناء APK (debug)
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon

      - name: رفع الـ APK كـ Artifact
        uses: actions/upload-artifact@v4
        with:
          name: yalla-admin-apk
          path: admin/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
