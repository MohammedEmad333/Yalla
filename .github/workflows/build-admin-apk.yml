# بناء APK لنسخة أندرويد من لوحة الأدمن — تلقائيًا على خوادم GitHub.
#
# التشغيل: تلقائيًا عند تغيّر ملفّات admin/** على main، أو يدويًا من تبويب Actions،
# أو عند دفع وسم admin-v*.
# النتيجة الأساسية: APK يُنشر على GitHub Release ثابت باسم yalla-admin-latest.
# Artifact يبقى نسخة مؤقتة اختيارية فقط، حتى لا تمنع حصة Actions نجاح البناء.
#
# أسرار مطلوبة/اختيارية (Settings → Secrets and variables → Actions):
#   GOOGLE_SERVICES_JSON         (الأسهل، لتفعيل الإشعارات) الصق محتوى ملف google-services.json كما هو.
#   GOOGLE_SERVICES_JSON_BASE64  (بديل) نفس الملف مُرمَّزًا base64.
#   ANDROID_KEYSTORE_BASE64 / KEYSTORE_PASSWORD / KEY_ALIAS / KEY_PASSWORD (اختياري) للإصدار الموقَّع.

name: Build Admin APK

on:
  workflow_dispatch:
    inputs:
      api_url:
        description: 'رابط اختباري اختياري للتشغيل اليدوي فقط'
        required: false
        default: ''
  push:
    tags: ['admin-v*']
    branches: ['main']
    paths:
      - 'admin/**'
      - '.github/workflows/build-admin-apk.yml'

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: إعداد Java 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'

      - name: إعداد Node 22
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22'

      - name: إعداد Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: platform-tools

      - name: تثبيت التبعيات
        run: npm ci

      - name: إضافة google-services.json (لتفعيل الإشعارات) إن توفّر
        env:
          GS_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
          GS_B64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          OUT=android/app/google-services.json
          validate() {
            if grep -q '"private_key"' "$OUT" && ! grep -q '"project_info"' "$OUT"; then
              echo "::error::يبدو أنّك وضعت مفتاح خدمة Firebase (fcm.json) بدل google-services.json. الملف المطلوب يُنزَّل من Firebase Console ← Project settings ← Your apps ← تطبيق Android بالحزمة com.yalla.admin ← google-services.json (يحوي project_info)."
              return 1
            fi
            if ! grep -q '"project_info"' "$OUT"; then
              echo "::error::google-services.json غير صالح (لا يحوي project_info). نزّله من Firebase Console لتطبيق Android بالحزمة com.yalla.admin."
              return 1
            fi
          }
          if [ -n "$GS_JSON" ]; then
            printf '%s' "$GS_JSON" > "$OUT"
            validate || exit 1
            echo "✅ google-services.json (JSON خام) مضاف — الإشعارات مفعّلة"
          elif [ -n "$GS_B64" ]; then
            if ! printf '%s' "$GS_B64" | tr -d '[:space:]' | base64 -d > "$OUT" 2>/dev/null; then
              echo "::error::GOOGLE_SERVICES_JSON_BASE64 ليس base64 صالحًا. الأسهل: استخدم السرّ GOOGLE_SERVICES_JSON وألصق محتوى الملف كما هو."
              exit 1
            fi
            validate || exit 1
            echo "✅ google-services.json (base64) مضاف — الإشعارات مفعّلة"
          else
            echo "⚠️ بلا إعداد Firebase — سيُبنى التطبيق بلا إشعارات Push"
          fi

      - name: بناء الويب (Vite) بعنوان الـ API
        env:
          INPUT_URL: ${{ github.event.inputs.api_url }}
        run: |
          API_URL="https://api.yalladelivery.org"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "$INPUT_URL" ]; then
            API_URL="$INPUT_URL"
          fi
          echo "✅ Admin API: $API_URL"
          VITE_API_URL="$API_URL" npm run build

      - name: مزامنة Capacitor
        run: npx cap sync android

      - name: بناء APK (debug)
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon

      - name: تجهيز ملف الإصدار
        run: cp android/app/build/outputs/apk/debug/app-debug.apk ../Yalla-Admin.apk

      - name: نشر APK على GitHub Release
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: yalla-admin-latest
        run: |
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" \
              --target "$GITHUB_SHA" \
              --title "Yalla Admin APK" \
              --notes "آخر بناء متاح لتطبيق Yalla Admin على Android."
          fi
          gh release upload "$TAG" Yalla-Admin.apk --clobber
          echo "✅ تم نشر Yalla-Admin.apk على GitHub Release: $TAG"

      # نسخة إضافية مؤقتة فقط؛ فشل Artifact quota لا يجب أن يفشل البناء أو يمنع تنزيل APK من Release.
      - name: رفع الـ APK كـ Artifact اختياري
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        continue-on-error: true
        with:
          name: yalla-admin-apk
          path: admin/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
