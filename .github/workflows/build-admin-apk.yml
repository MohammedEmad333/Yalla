# بناء APK لنسخة أندرويد من لوحة الأدمن (Card 103) — تلقائيًا على خوادم GitHub.
#
# التشغيل: يدويًا من تبويب Actions (Run workflow)، أو عند دفع وسم admin-v*.
# النتيجة: ملف app-debug.apk يُرفع كـ Artifact لتنزيله وتثبيته على الهاتف.
#
# أسرار مطلوبة/اختيارية (Settings → Secrets and variables → Actions):
#   ADMIN_API_URL                (مطلوب) رابط الخادم المنشور، مثل https://yalla-api.onrender.com
#   GOOGLE_SERVICES_JSON_BASE64  (اختياري) محتوى google-services.json مُرمَّزًا base64 لتفعيل الإشعارات.
#                                 توليده: base64 -w0 google-services.json
#   ANDROID_KEYSTORE_BASE64 / KEYSTORE_PASSWORD / KEY_ALIAS / KEY_PASSWORD (اختياري) للإصدار الموقَّع.

name: Build Admin APK

on:
  workflow_dispatch:
    inputs:
      api_url:
        description: 'رابط الخادم (يتجاوز ADMIN_API_URL إن مُلئ)'
        required: false
        default: ''
  push:
    tags: ['admin-v*']

jobs:
  build-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin
    steps:
      - uses: actions/checkout@v4

      - name: إعداد Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: إعداد Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: إعداد Android SDK
        uses: android-actions/setup-android@v3

      - name: تثبيت التبعيات
        run: npm install

      - name: إضافة google-services.json (لتفعيل الإشعارات) إن توفّر
        env:
          GS_B64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [ -n "$GS_B64" ]; then
            echo "$GS_B64" | base64 -d > android/app/google-services.json
            echo "✅ google-services.json مضاف — الإشعارات مفعّلة"
          else
            echo "⚠️ بلا google-services.json — سيُبنى التطبيق بلا إشعارات Push"
          fi

      - name: بناء الويب (Vite) بعنوان الـ API
        env:
          INPUT_URL: ${{ github.event.inputs.api_url }}
          SECRET_URL: ${{ secrets.ADMIN_API_URL }}
        run: |
          API_URL="${INPUT_URL:-$SECRET_URL}"
          if [ -z "$API_URL" ]; then
            echo "::warning::لم يُضبط ADMIN_API_URL — التطبيق لن يصل للخادم. اضبط السرّ ADMIN_API_URL."
          fi
          VITE_API_URL="$API_URL" npm run build

      - name: مزامنة Capacitor
        run: npx cap sync android

      - name: بناء APK (debug)
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon

      - name: رفع الـ APK كـ Artifact
        uses: actions/upload-artifact@v4
        with:
          name: yalla-admin-apk
          path: admin/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
