name: Build & Deploy Yalla Admin Web

on:
  pull_request:
    paths:
      - 'admin/**'
      - 'wrangler-admin.toml'
      - '.github/workflows/admin-web.yml'
  workflow_dispatch:
    inputs:
      api_origin:
        description: 'عنوان الـ Backend'
        required: false
        default: 'https://api.yalladelivery.org'
  push:
    branches: ['main']
    paths:
      - 'admin/**'
      - 'wrangler-admin.toml'
      - '.github/workflows/admin-web.yml'

permissions:
  contents: read

concurrency:
  group: admin-web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: admin/package-lock.json

      - name: تثبيت تبعيات لوحة الأدمن
        working-directory: admin
        run: npm ci

      - name: بناء لوحة الأدمن
        working-directory: admin
        env:
          INPUT_ORIGIN: ${{ github.event.inputs.api_origin }}
        run: |
          export VITE_API_URL="${INPUT_ORIGIN:-https://api.yalladelivery.org}"
          echo "Building admin for API: $VITE_API_URL"
          npm run build

      - name: رفع نسخة الأدمن كـ Artifact
        uses: actions/upload-artifact@v4
        with:
          name: yalla-admin-web
          path: admin/dist
          if-no-files-found: error

      - name: نشر على Cloudflare Workers
        if: ${{ github.event_name != 'pull_request' && env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != '' }}
        run: npx --yes wrangler deploy --config wrangler-admin.toml
