<script>
    // Simple toggle interaction for the status button
    const statusToggle = document.getElementById('statusToggle');
    let isAvailable = true;

    statusToggle.addEventListener('click', () => {
        isAvailable = !isAvailable;
        if(isAvailable) {
            statusToggle.classList.remove('bg-surface-variant', 'text-on-surface');
            statusToggle.classList.add('bg-primary-container', 'text-on-primary', 'shadow-level-3', 'glow-top-edge');
            statusToggle.innerHTML = '<span class="material-symbols-outlined">power_settings_new</span><span>أنا متاح للطلبات</span>';
        } else {
            statusToggle.classList.remove('bg-primary-container', 'text-on-primary', 'shadow-level-3', 'glow-top-edge');
            statusToggle.classList.add('bg-surface-variant', 'text-on-surface');
            statusToggle.innerHTML = '<span class="material-symbols-outlined text-error">power_off</span><span>غير متاح حالياً</span>';
        }
    });
</script>
