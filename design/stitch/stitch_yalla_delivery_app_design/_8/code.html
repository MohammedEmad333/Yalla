<script>
        // Simple script to handle star rating logic
        function setupRating(containerId) {
            const container = document.getElementById(containerId);
            if (!container) return;
            
            const stars = container.querySelectorAll('.rating-star');
            
            stars.forEach(star => {
                star.addEventListener('click', () => {
                    const value = parseInt(star.getAttribute('data-value'));
                    
                    // Reset all
                    stars.forEach(s => s.classList.remove('selected'));
                    
                    // Select clicked and previous (because of flex-row-reverse, we select values <= clicked)
                    stars.forEach(s => {
                        if (parseInt(s.getAttribute('data-value')) <= value) {
                            s.classList.add('selected');
                        }
                    });
                });
            });
        }

        // Setup both rating sections
        setupRating('captain-rating');
        setupRating('order-rating');

        // Setup feedback chips toggle
        const chips = document.querySelectorAll('.feedback-chip');
        chips.forEach(chip => {
            chip.addEventListener('click', () => {
                chip.classList.toggle('selected');
            });
        });
    </script>
