<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>يلا · Yalla — حمّل التطبيق</title>
  <meta name="description" content="تطبيق يلا للتوصيل اللحظي — حمّله من Google Play أو افتحه كتطبيق ويب على الآيفون." />

  <!-- أيقونات وهوية PWA (Card 53) -->
  <link rel="icon" type="image/png" href="icon-192.png" />
  <link rel="manifest" href="manifest.webmanifest" />
  <meta name="theme-color" content="#FF6B00" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#14161a" media="(prefers-color-scheme: dark)" />

  <!-- دعم "أضف إلى الشاشة الرئيسية" على iOS ليفتح كتطبيق مستقلّ -->
  <link rel="apple-touch-icon" href="icon-192.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Yalla" />

  <!-- خطّ الهوية: IBM Plex Sans Arabic (نفس خطّ التطبيق ولوحة التحكّم) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="yalla.css" />
</head>
<body>
  <header class="hero">
    <img class="logo" src="icon-192.png" alt="شعار يلا" />
    <div class="brand">Yalla · يلا 🛵</div>
    <p>توصيلك اللحظي — بضغطة واحدة</p>
  </header>

  <div class="wrap">
    <main class="card">
      <!-- Card 53: زرّ التحميل من Google Play في الأعلى -->
      <a class="cta-primary" id="playBtn"
         href="https://play.google.com/store/apps/details?id=com.mohammedemad333.yalla"
         target="_blank" rel="noopener">
        <span class="gp">▶</span> حمّل التطبيق من Google Play
      </a>
      <p class="cta-sub">لأجهزة أندرويد — عبر Google Play.</p>

      <div class="divider">أو</div>

      <a class="cta-primary" href="https://app.yalladelivery.org">🌐 افتح تطبيق Yalla على الويب</a>
      <p class="cta-sub">يعمل مباشرة من المتصفح على الجوال والديسكتوب.</p>

      <a class="contact"
         href="https://wa.me/970593456405?text=%D9%85%D8%B1%D8%AD%D8%A8%D9%8B%D8%A7%D8%8C%20%D8%A3%D8%AD%D8%AA%D8%A7%D8%AC%20%D9%85%D8%B3%D8%A7%D8%B9%D8%AF%D8%A9%20%D8%A8%D8%AE%D8%B5%D9%88%D8%B5%20%D8%AA%D8%B7%D8%A8%D9%8A%D9%82%20%D9%8A%D9%84%D8%A7"
         target="_blank" rel="noopener">💬 تواصل معنا عبر واتساب</a>

      <footer>
        © 2026 Yalla (يلا) ·
        <a href="privacy.html">سياسة الخصوصية</a> ·
        <a href="delete-account.html">حذف الحساب</a>
      </footer>
    </main>
  </div>

  <script>
    // اكتشاف iOS لعرض تعليمات "أضف إلى الشاشة الرئيسية"
    (function () {
      var ua = window.navigator.userAgent || '';
      var isIOS = /iPad|iPhone|iPod/.test(ua) ||
        (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1); // iPadOS
      var isStandalone = window.matchMedia('(display-mode: standalone)').matches ||
        window.navigator.standalone === true;

      if (isStandalone) {
        // التطبيق مثبّت ويعمل كتطبيق مستقلّ — نُخفي دعوة التثبيت
        var box = document.getElementById('webIntro');
        if (box) box.textContent = 'أنت تستخدم يلا كتطبيق ويب مثبّت — أهلًا بك! 🎉';
      }

      if (isIOS) {
        document.getElementById('iosSteps').style.display = 'block';
      } else {
        document.getElementById('androidHint').style.display = 'block';
      }
    })();

    // زرّ التثبيت على المتصفّحات الداعمة (Android/Chrome/Edge)
    var deferredPrompt = null;
    var installBtn = document.getElementById('installBtn');
    window.addEventListener('beforeinstallprompt', function (e) {
      e.preventDefault();
      deferredPrompt = e;
      installBtn.disabled = false;
    });
    installBtn.addEventListener('click', function () {
      if (!deferredPrompt) return;
      deferredPrompt.prompt();
      deferredPrompt.userChoice.finally(function () {
        deferredPrompt = null;
        installBtn.disabled = true;
      });
    });

    // تسجيل Service Worker لجعلها تطبيق ويب قابلًا للتثبيت
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('sw.js').catch(function () {});
      });
    }
  </script>
</body>
</html>
